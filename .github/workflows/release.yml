name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-launcher:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build launcher
        run: npm run launcher:build || true

      - name: Generate SBOM
        uses: CycloneDX/gh-node-module-generatebom@v4
        with:
          path: '.'
          output: 'bom.json'

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Leadflow.exe
            release/leadflow.cjs
            bom.json
